<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 515" role="img" aria-labelledby="title description">
  <title id="title">깊이별 합성곱과 점별 합성곱의 두 단계</title>
  <desc id="description">첫 단계에서는 입력 채널 세 개에 각각 다른 3×3 필터를 하나씩 적용하여 채널 세 개를 만든다. 둘째 단계에서는 각 1×1 필터가 세 채널을 모두 읽고, 필터 두 개가 최종 출력 채널 두 개를 만든다.</desc>
  <defs>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" fill="none" stroke="#7e7573" stroke-opacity=".3"/></pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#756c69"/></marker>
    <style>
      text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#312b2a}.head{font-size:20px;font-weight:700}.sub{font-size:15px;fill:#625957}.label{font-size:17px;font-weight:700}.small{font-size:14px;fill:#625957}.line{fill:none;stroke:#756c69;stroke-width:1.9;marker-end:url(#arrow)}.bus{fill:none;stroke:#9d9290;stroke-width:1.7}
    </style>
  </defs>
  <rect width="540" height="515" fill="#fff"/>
  <text class="head" x="20" y="31">① 3×3 Depthwise</text>
  <text class="sub" x="20" y="56">입력 채널마다 자기 필터 하나만 적용</text>
  <g class="small" text-anchor="middle"><text x="57" y="82">입력</text><text x="184" y="82">3×3 필터</text><text x="371" y="82">결과</text></g>
  <g stroke-width="1.5">
    <rect x="22" y="100" width="70" height="46" rx="3" fill="#e9f2f1" stroke="#3d7771"/><rect x="22" y="100" width="70" height="46" fill="url(#grid)"/>
    <rect x="22" y="158" width="70" height="46" rx="3" fill="#f6ece5" stroke="#af7048"/><rect x="22" y="158" width="70" height="46" fill="url(#grid)"/>
    <rect x="22" y="216" width="70" height="46" rx="3" fill="#eeeaf3" stroke="#79658c"/><rect x="22" y="216" width="70" height="46" fill="url(#grid)"/>
    <rect x="336" y="100" width="70" height="46" rx="3" fill="#e9f2f1" stroke="#3d7771"/><rect x="336" y="100" width="70" height="46" fill="url(#grid)"/>
    <rect x="336" y="158" width="70" height="46" rx="3" fill="#f6ece5" stroke="#af7048"/><rect x="336" y="158" width="70" height="46" fill="url(#grid)"/>
    <rect x="336" y="216" width="70" height="46" rx="3" fill="#eeeaf3" stroke="#79658c"/><rect x="336" y="216" width="70" height="46" fill="url(#grid)"/>
    <rect x="165" y="103" width="38" height="38" rx="2" fill="#e9f2f1" stroke="#3d7771"/>
    <rect x="165" y="161" width="38" height="38" rx="2" fill="#f6ece5" stroke="#af7048"/>
    <rect x="165" y="219" width="38" height="38" rx="2" fill="#eeeaf3" stroke="#79658c"/>
    <path d="M177 103v38m13-38v38m-25-25h38m-38 12h38M177 161v38m13-38v38m-25-25h38m-38 12h38M177 219v38m13-38v38m-25-25h38m-38 12h38" stroke="#847876" stroke-opacity=".55"/>
  </g>
  <g class="label" text-anchor="middle"><text x="57" y="129">C₁</text><text x="57" y="187">C₂</text><text x="57" y="245">C₃</text><text x="371" y="129">C₁′</text><text x="371" y="187">C₂′</text><text x="371" y="245">C₃′</text></g>
  <g class="line"><path d="M97 123h57"/><path d="M97 181h57"/><path d="M97 239h57"/><path d="M210 123h115"/><path d="M210 181h115"/><path d="M210 239h115"/></g>
  <g class="small"><text x="425" y="126">C₁만 처리</text><text x="425" y="184">C₂만 처리</text><text x="425" y="242">C₃만 처리</text></g>
  <text class="sub" x="20" y="286">채널끼리 섞이지 않음: 3채널 → 3채널</text>
  <path d="M20 305H520" stroke="#d9cfcb"/>
  <text class="head" x="20" y="338">② 1×1 Pointwise</text>
  <text class="sub" x="20" y="362">각 필터가 세 채널을 모두 읽어 새로운 채널을 만듦</text>
  <g stroke-width="1.3">
    <rect x="22" y="380" width="54" height="25" rx="2" fill="#e9f2f1" stroke="#3d7771"/><rect x="22" y="408" width="54" height="25" rx="2" fill="#f6ece5" stroke="#af7048"/><rect x="22" y="436" width="54" height="25" rx="2" fill="#eeeaf3" stroke="#79658c"/>
    <rect x="191" y="382" width="24" height="24" fill="#e9f2f1" stroke="#3d7771"/><rect x="216" y="382" width="24" height="24" fill="#f6ece5" stroke="#af7048"/><rect x="241" y="382" width="24" height="24" fill="#eeeaf3" stroke="#79658c"/>
    <rect x="191" y="433" width="24" height="24" fill="#e9f2f1" stroke="#3d7771"/><rect x="216" y="433" width="24" height="24" fill="#f6ece5" stroke="#af7048"/><rect x="241" y="433" width="24" height="24" fill="#eeeaf3" stroke="#79658c"/>
    <rect x="430" y="382" width="66" height="32" rx="3" fill="#f3e6e4" stroke="#702e36"/><rect x="430" y="433" width="66" height="32" rx="3" fill="#f3e6e4" stroke="#702e36"/>
  </g>
  <g class="label" text-anchor="middle"><text x="49" y="399">C₁′</text><text x="49" y="427">C₂′</text><text x="49" y="455">C₃′</text><text x="463" y="404">O₁</text><text x="463" y="455">O₂</text></g>
  <g class="bus"><path d="M82 392h38m-38 28h38m-38 28h38M120 392v56"/></g>
  <g class="line"><path d="M120 394h60"/><path d="M120 445h60"/><path d="M337 394h82"/><path d="M337 445h82"/></g>
  <g class="small"><text x="273" y="401">1×1 필터 A</text><text x="273" y="452">1×1 필터 B</text></g>
  <text class="sub" x="20" y="496">세 채널을 다른 방식으로 결합: 3채널 → 2채널</text>
</svg>
