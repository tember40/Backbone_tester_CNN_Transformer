name: Deploy AI learning site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "index.html"
      - "chapters/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare compatible static URL layout
        run: |
          mkdir -p "$RUNNER_TEMP/backbone-pages/docs" "$RUNNER_TEMP/backbone-pages/chapters"
          cp -R docs/. "$RUNNER_TEMP/backbone-pages/docs/"
          cp index.html "$RUNNER_TEMP/backbone-pages/index.html"
          cp chapters/*.html "$RUNNER_TEMP/backbone-pages/chapters/"
          touch "$RUNNER_TEMP/backbone-pages/.nojekyll"
      - name: Upload static learning site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/backbone-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
